<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soạn Câu Hỏi - Toán Học Vui</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/soan-cau-hoi.css">

    <!-- Cấu hình MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</head>

<body>

    <div class="editor-layout">
        <!-- Cột Trái -->
        <div class="box">
            <h2>✍️ Thêm Câu Hỏi Mới</h2>

            <div class="form-group">
                <label>Loại câu hỏi</label>
                <select id="question-type" onchange="doiLoaiCauHoi()">
                    <option value="MCQ">Trắc nghiệm 4 lựa chọn (MCQ)</option>
                    <option value="TRUE_FALSE">Đúng / Sai</option>
                    <option value="SHORT_ANSWER">Điền đáp án ngắn</option>
                    <option value="ESSAY">Tự luận (Học sinh tự trình bày)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nội dung câu hỏi (Hỗ trợ gõ LaTeX $ $ hoặc $$ $$)</label>
                <textarea id="question-text" placeholder="VD: Giải phương trình $2x + 4 = 0$"></textarea>
            </div>

            <!-- KHU VỰC 1: ẢNH ĐỀ BÀI (Đã sửa ID chuẩn) -->
            <div class="form-group"
                style="margin-top: 15px; padding: 15px; border: 2px dashed #cbd5e1; border-radius: 10px; background: #f8fafc;">
                <label>🖼️ Đính kèm ảnh (Cho bài Hình học, Đồ thị, Bảng biểu...)</label>
                <input type="file" id="image-upload-question" accept="image/png, image/jpeg"
                    onchange="taiAnhLen(event, 'cau_hoi')" style="border: none; padding: 0;">

                <div id="upload-status-question" style="font-size: 14px; font-weight: bold; margin-top: 8px;"></div>

                <!-- Vùng hiển thị ảnh xem trước sau khi tải xong -->
                <div id="preview-container-question" style="margin-top: 10px; display: none; text-align: center;">
                    <img id="preview-img-question" src=""
                        style="max-width: 100%; max-height: 250px; border-radius: 8px; border: 1px solid #ccc; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                </div>
            </div>

            <div id="dynamic-answer-area"></div>

            <div class="form-group" style="margin-top: 20px;">
                <label>Lời giải chi tiết (Tuỳ chọn)</label>
                <textarea id="explanation" placeholder="Giải thích chi tiết cho học sinh hiểu..."></textarea>
            </div>

            <!-- KHU VỰC 2: ẢNH LỜI GIẢI -->
            <div class="form-group"
                style="margin-top: 10px; padding: 15px; border: 2px dashed #d1fae5; border-radius: 10px; background: #ecfdf5;">
                <label style="color: #047857;">🖼️ Đính kèm ảnh cho LỜI GIẢI (Tuỳ chọn)</label>
                <input type="file" id="image-upload-solution" accept="image/png, image/jpeg"
                    onchange="taiAnhLen(event, 'loi_giai')" style="border: none; padding: 0;">
                <div id="upload-status-solution" style="font-size: 14px; font-weight: bold; margin-top: 8px;"></div>
                <div id="preview-container-solution" style="margin-top: 10px; display: none; text-align: center;">
                    <img id="preview-img-solution" src=""
                        style="max-width: 100%; max-height: 250px; border-radius: 8px; border: 1px solid #ccc;">
                </div>
            </div>

            <!-- HAI NÚT BẤM KẾ TIẾP NHAU -->
            <div style="display: flex; gap: 10px;">
                <button onclick="xemTruoc()"
                    style="width: 30%; background: #e2e8f0; color: #2b3674; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">👀
                    Xem Trước</button>
                <button class="btn-add" onclick="luuCauHoi()" style="width: 70%;">Lưu Câu Này</button>
            </div>

            <div id="msg" style="margin-top: 10px; text-align: center; font-weight: bold;"></div>
        </div>

        <!-- Cột Phải -->
        <div style="background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <!-- Đã thêm id="question-count-header" để JS tự đếm số lượng -->
            <h3 id="question-count-header"
                style="color: #2b3674; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 15px;">
                📋 Danh sách câu hỏi (0)
            </h3>

            <!-- Vùng chứa danh sách câu hỏi, có thanh cuộn nếu quá nhiều câu -->
            <div id="question-list-container" style="max-height: 500px; overflow-y: auto; margin-bottom: 20px;">
                <p style="color: #888; font-style: italic; text-align: center;">Đang tải danh sách...</p>
            </div>

            <button onclick="hoanTatBai()"
                style="width: 100%; background: #05cd99; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer;">
                Hoàn Tất Bài Kiểm Tra
            </button>
        </div>
    </div>

    <!-- KHUNG POPUP XEM TRƯỚC (Bị ẩn) -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="dongXemTruoc()">&times;</button>
            <h2 style="color: #4318ff; margin-bottom: 20px;">👀 Xem Trước Giao Diện Học Sinh</h2>

            <!-- Nơi nội dung sẽ được đổ vào -->
            <div id="preview-content" style="font-size: 16px; line-height: 1.6; color: #2b3674;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/header.js"></script>
    <script src="js/soan-cau-hoi.js"></script>
</body>

</html>
